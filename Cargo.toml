[package]
name = "termnix"
version = "0.3.0"
edition = "2024"
exclude = ["backlog/"]
rust-version = "1.98"
authors = ["Takeru Ohta <phjgt308@gmail.com>"]
description = "A Unix-only library for PTY-backed child processes and terminal emulation"
license = "MIT"
homepage = "https://github.com/sile/termnix"
repository = "https://github.com/sile/termnix"
readme = "README.md"
keywords = ["terminal", "emulator", "pty", "unix"]
categories = ["command-line-interface"]

[dependencies]
libc = "0.2"
unicode-width = "0.2"
vte = { version = "0.15", default-features = false, features = ["std"] }

[dev-dependencies]
tuinix = "0.7"
noprop = "0.2"
